[package]
name = "wcdb-native"
version = "5.0.0"
edition = "2021"
publish = false

[lib]
name = "wcdb_api"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 2
debug = false
panic = "abort"

[dependencies]
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = "1.0.154"
pbkdf2 = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
